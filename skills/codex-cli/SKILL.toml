[skill]
name = "codex-cli"
description = "Run the installed Codex CLI non-interactively on an approved task in a trusted checkout."
version = "0.2.0"

[[tools]]
name = "ask"
description = "Run Codex exec in the agent workspace. Depending on its configuration, Codex and its integrations may read or edit files, run commands and send context to providers. Approve the task and workspace."
kind = "shell"
argv = ["codex", "exec", "--", "{{prompt}}"]
timeout_secs = 3600

[tools.args]
prompt = "The task and material the operator approves for this Codex run in the current workspace."
