[skill]
name = "agy-cli"
description = "Ask Antigravity for analysis or a plan using a trusted workspace."
version = "0.3.0"

[[tools]]
name = "ask"
description = "Run one headless AGY prompt using the CLI’s settings. Slash commands and skills may expand; AGY may run commands, edit files and send context to its provider. Approve the task and material."
kind = "shell"
argv = ["agy", "-p", "{{prompt}}"]
timeout_secs = 3600

[tools.args]
prompt = "The question or planning task, including which project material the operator intends AGY to use."
